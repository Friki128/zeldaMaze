<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="content">
        <h1>Maze</h1>
        <form th:action="'/admin' + ${type} + 'Maze'" th:switch="${type}" method="post">
            <input type="number" name="id" id="id" th:value="${id}" class="hidden" th:case="Update">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" th:value="${name}">
            <input class="button" type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
